# Render Blueprint - 掌心窗公开版 unified 单服务版
# 把 Python 后端 + Node MCP + 反向代理合并到一个 Docker Web Service，
# 适配 Render 免费套餐（750 实例小时/月，单服务全天候运行不超额）。
# 双服务版配置见 git 历史（v0.3.8.8 之前的 render.yaml）。
#
# 部署方式一：Render 后台 → New + → Blueprint → 选择本仓库与分支。
# 部署方式二：New + → Web Service → Public Git repository 粘贴仓库地址，
#   手动按下方参数创建（Runtime=Docker, Dockerfile Path=./Dockerfile）。
#
# 部署后：
# - 手机 App 填服务的外部地址（根域名，不带路径）。
# - AI/MCP 客户端填 <域名>/mcp 或 <域名>/sse。
services:
  - type: web
    name: linjian-mcp-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # 部署时需要在后台填写（与手机 App、MCP 共用的访问令牌）
      - key: LINJIAN_TOKEN
        sync: false
      - key: LINJIAN_HOST
        value: 0.0.0.0
      - key: LINJIAN_DEFAULT_DEVICE
        value: android-phone
      - key: LINJIAN_KEEP
        value: "3"
